<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="600" viewBox="0 0 1100 600" role="img" aria-labelledby="title desc">
<title id="title">Fra publisert kode til faktisk gjenbruk</title>
<desc id="desc">Trapp med fem steg som stiger fra venstre mot høyre. 1 Publisert kode: koden er teknisk tilgjengelig. 2 Åpen lisens: andre vet hva de har lov til. 3 Dokumentasjon: formål, bruk og installasjon er forklart. 4 Forvaltning: eier, kontaktpunkt og vedlikehold er avklart. 5 Gjenbrukbar løsning: andre kan vurdere, ta i bruk og bygge videre.</desc>
<style>
  text { font-family: Arial, sans-serif; fill: #1E2B3C; }
  .h { font-size: 34px; }
  .sub { font-size: 20px; }
  .n { font-size: 42px; }
  .t { font-size: 24px; }
  .d { font-size: 20px; }
  .inv { fill: #FFFFFF; }
</style>

<rect width="1100" height="600" fill="#FFFFFF"/>

<text class="h" x="30" y="62">Fra publisert kode til faktisk gjenbruk</text>
<text class="sub" x="30" y="100">Hvert steg gjør det enklere for andre å ta koden i bruk</text>

<!-- 1 Publisert kode -->
<rect x="30" y="360" width="198" height="200" fill="#E7E6E6"/>
<text class="n" x="48" y="412">1</text>
<text class="t" x="48" y="452">Publisert kode</text>
<text class="d" x="48" y="484">Koden er teknisk</text>
<text class="d" x="48" y="510">tilgjengelig</text>

<!-- 2 Åpen lisens -->
<rect x="240" y="315" width="198" height="245" fill="#D2EAFD"/>
<text class="n" x="258" y="367">2</text>
<text class="t" x="258" y="407">Åpen lisens</text>
<text class="d" x="258" y="439">Andre vet hva de</text>
<text class="d" x="258" y="465">har lov til</text>

<!-- 3 Dokumentasjon -->
<rect x="450" y="270" width="198" height="290" fill="#FAEEC2"/>
<text class="n" x="468" y="322">3</text>
<text class="t" x="468" y="362">Dokumentasjon</text>
<text class="d" x="468" y="394">Formål, bruk og</text>
<text class="d" x="468" y="420">installasjon er</text>
<text class="d" x="468" y="446">forklart</text>

<!-- 4 Forvaltning -->
<rect x="660" y="225" width="198" height="335" fill="#FDDFE0"/>
<text class="n" x="678" y="277">4</text>
<text class="t" x="678" y="317">Forvaltning</text>
<text class="d" x="678" y="349">Eier, kontaktpunkt</text>
<text class="d" x="678" y="375">og vedlikehold er</text>
<text class="d" x="678" y="401">avklart</text>

<!-- 5 Gjenbrukbar løsning -->
<rect x="870" y="180" width="198" height="380" fill="#1E2B3C"/>
<text class="n inv" x="888" y="232">5</text>
<text class="t inv" x="888" y="272">Gjenbrukbar</text>
<text class="t inv" x="888" y="300">løsning</text>
<text class="d inv" x="888" y="332">Andre kan vurdere,</text>
<text class="d inv" x="888" y="358">ta i bruk og bygge</text>
<text class="d inv" x="888" y="384">videre</text>
</svg>
