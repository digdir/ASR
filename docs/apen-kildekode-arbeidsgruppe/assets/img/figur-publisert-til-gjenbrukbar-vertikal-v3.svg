<svg xmlns="http://www.w3.org/2000/svg" width="760" height="920" viewBox="0 0 760 920" role="img" aria-labelledby="title desc">
<title id="title">Fra publisert kode til faktisk gjenbruk</title>
<desc id="desc">Vertikal stegmodell som viser hva som må på plass før publisert kode kan gjenbrukes.</desc>
<defs>
  <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#24483A" flood-opacity="0.11"/>
  </filter>
</defs>

<rect width="760" height="920" fill="#F6FAF7"/>
<circle cx="670" cy="40" r="78" fill="#EAF4EE" opacity="0.68"/>
<circle cx="40" cy="850" r="96" fill="#EAF4EE" opacity="0.52"/>

<text x="360.0" y="58" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="32" font-weight="750" fill="#B46A1F">Fra publisert kode til faktisk gjenbruk</text>


<g filter="url(#softShadow)">
  <rect x="160" y="134" width="500" height="100" rx="14" fill="#FFFFFF" stroke="#BFD8C7" stroke-width="1.5"/>
</g>
<rect x="170" y="160" width="50" height="50" rx="13" fill="#EAF4EE" stroke="#BFD8C7" stroke-width="1"/>
<text x="195" y="192" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="800" fill="#3F7D5A">1</text>

<text x="236" y="188" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="800" fill="#24483A">PUBLISERT KODE</text>
<text x="236" y="219" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="450" fill="#1F2D27">Koden er teknisk tilgjengelig</text>

<line x1="360.0" y1="246" x2="360.0" y2="259" stroke="#6FA37D" stroke-width="4" stroke-linecap="round"/>
<polygon points="345.0,254 375.0,254 360.0,267" fill="#6FA37D"/>


<g filter="url(#softShadow)">
  <rect x="160" y="284" width="500" height="100" rx="14" fill="#FFFFFF" stroke="#BFD8C7" stroke-width="1.5"/>
</g>
<rect x="170" y="310" width="50" height="50" rx="13" fill="#EAF4EE" stroke="#BFD8C7" stroke-width="1"/>
<text x="195" y="342" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="800" fill="#3F7D5A">2</text>

<text x="236" y="338" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="800" fill="#24483A">ÅPEN LISENS</text>
<text x="236" y="369" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="450" fill="#1F2D27">Andre vet hva de har lov til</text>

<line x1="360.0" y1="402" x2="360.0" y2="415" stroke="#6FA37D" stroke-width="4" stroke-linecap="round"/>
<polygon points="345.0,410 375.0,410 360.0,423" fill="#6FA37D"/>


<g filter="url(#softShadow)">
  <rect x="160" y="440" width="500" height="100" rx="14" fill="#FFFFFF" stroke="#BFD8C7" stroke-width="1.5"/>
</g>
<rect x="170" y="466" width="50" height="50" rx="13" fill="#EAF4EE" stroke="#BFD8C7" stroke-width="1"/>
<text x="195" y="498" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="800" fill="#3F7D5A">3</text>

<text x="236" y="494" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="800" fill="#24483A">DOKUMENTASJON</text>
<text x="236" y="525" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="450" fill="#1F2D27">Formål, bruk og installasjon er forklart</text>

<line x1="360.0" y1="558" x2="360.0" y2="571" stroke="#6FA37D" stroke-width="4" stroke-linecap="round"/>
<polygon points="345.0,566 375.0,566 360.0,579" fill="#6FA37D"/>


<g filter="url(#softShadow)">
  <rect x="160" y="596" width="500" height="100" rx="14" fill="#FFFFFF" stroke="#BFD8C7" stroke-width="1.5"/>
</g>
<rect x="170" y="622" width="50" height="50" rx="13" fill="#EAF4EE" stroke="#BFD8C7" stroke-width="1"/>
<text x="195" y="654" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="800" fill="#3F7D5A">4</text>

<text x="236" y="648" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="800" fill="#24483A">FORVALTNING</text>
<text x="236" y="679" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="450" fill="#1F2D27">Eier, kontaktpunkt og vedlikehold er avklart</text>

<line x1="360.0" y1="714" x2="360.0" y2="727" stroke="#6FA37D" stroke-width="4" stroke-linecap="round"/>
<polygon points="345.0,722 375.0,722 360.0,735" fill="#6FA37D"/>


<g filter="url(#softShadow)">
  <rect x="160" y="752" width="500" height="100" rx="14" fill="#FFFFFF" stroke="#BFD8C7" stroke-width="1.5"/>
</g>
<rect x="170" y="778" width="50" height="50" rx="13" fill="#EAF4EE" stroke="#BFD8C7" stroke-width="1"/>
<text x="195" y="810" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="800" fill="#3F7D5A">5</text>

<text x="236" y="804" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="800" fill="#24483A">GJENBRUKBAR LØSNING</text>
<text x="236" y="835" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="450" fill="#1F2D27">Andre kan vurdere, ta i bruk og bygge videre</text>
</svg>