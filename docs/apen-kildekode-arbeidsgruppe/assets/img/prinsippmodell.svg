<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 620" role="img" aria-labelledby="title desc">
  <title id="title">Modell for arbeidsgruppens tre prinsipper</title>
  <desc id="desc">Tre prinsipper: bruke, dele og bidra. Sammen styrker de digital suverenitet, åpenhet og den digitale grunnmuren.</desc>
  <defs>
    <style>
      .bg { fill: #f7fbfb; }
      .ring { fill: none; stroke: #d9e8e8; stroke-width: 18; }
      .center { fill: #ffffff; stroke: #1d6f7c; stroke-width: 4; }
      .card { fill: #ffffff; stroke-width: 3; rx: 18; }
      .use { stroke: #256f8f; }
      .share { stroke: #2f7d62; }
      .contribute { stroke: #806d21; }
      .connector { stroke: #88aeb2; stroke-width: 4; stroke-linecap: round; }
      .label { fill: #12343b; font: 700 34px Arial, sans-serif; }
      .sub { fill: #31565e; font: 22px Arial, sans-serif; }
      .small { fill: #31565e; font: 19px Arial, sans-serif; }
      .center-title { fill: #12343b; font: 700 30px Arial, sans-serif; }
      .center-sub { fill: #31565e; font: 20px Arial, sans-serif; }
      .pill { fill: #e8f2f2; stroke: #c7dcde; stroke-width: 2; }
    </style>
  </defs>

  <rect class="bg" width="1100" height="620" rx="28"/>
  <circle class="ring" cx="550" cy="320" r="190"/>
  <line class="connector" x1="550" y1="190" x2="550" y2="258"/>
  <line class="connector" x1="392" y1="410" x2="488" y2="350"/>
  <line class="connector" x1="708" y1="410" x2="612" y2="350"/>

  <rect class="card use" x="355" y="50" width="390" height="150" rx="18"/>
  <text class="label" x="550" y="102" text-anchor="middle">1. Bruke</text>
  <text class="sub" x="550" y="139" text-anchor="middle">Velg åpen kildekode</text>
  <text class="small" x="550" y="169" text-anchor="middle">der det gir kvalitet og handlingsrom</text>

  <rect class="card share" x="75" y="365" width="390" height="155" rx="18"/>
  <text class="label" x="270" y="419" text-anchor="middle">2. Dele</text>
  <text class="sub" x="270" y="456" text-anchor="middle">Publiser åpent som standard</text>
  <text class="small" x="270" y="486" text-anchor="middle">når kode er utviklet for offentlige midler</text>

  <rect class="card contribute" x="635" y="365" width="390" height="155" rx="18"/>
  <text class="label" x="830" y="419" text-anchor="middle">3. Bidra</text>
  <text class="sub" x="830" y="456" text-anchor="middle">Styrk prosjektene vi er avhengige av</text>
  <text class="small" x="830" y="486" text-anchor="middle">med finansiering, tid og vedlikehold</text>

  <circle class="center" cx="550" cy="320" r="102"/>
  <text class="center-title" x="550" y="294" text-anchor="middle">Åpen</text>
  <text class="center-title" x="550" y="329" text-anchor="middle">digital</text>
  <text class="center-title" x="550" y="364" text-anchor="middle">grunnmur</text>

  <rect class="pill" x="310" y="548" width="480" height="48" rx="24"/>
  <text class="center-sub" x="550" y="579" text-anchor="middle">Mer suverenitet, innsyn, gjenbruk og robusthet</text>
</svg>
