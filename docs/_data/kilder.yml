# Kildeliste for åpen kildekode-arbeidsgruppa.
# Denne fila er grunnlaget for siden /apen-kildekode-arbeidsgruppe/kilder/kildeliste.html
# og for nedlastingene kilder.json og kilder.csv.
#
# Slik legger du til en kilde: kopier en oppføring, gi den neste ledige id og fyll ut feltene.
# Ikke endre eller gjenbruk id-er, de brukes i lenker (kildeliste.html#K012).
#
# Felt:
#   id          K + tre siffer, fast
#   tittel      tittelen på kilden
#   avsender    hvem som står bak
#   lenke       full URL
#   kildetype   Regelverk og styring | Strategi og policy | Veiledning og praksis |
#               Standard, rammeverk og lisenser | Verktøy og tjenester | Rapport og analyse |
#               Eksempel og initiativ | Nyhet, artikkel og debatt
#   opphav      Norge | Norden | EU | Europa (land) | Internasjonalt
#   tema        1-3 av: Styring og organisering, Bruk og vurdering, Deling og publisering,
#               Bidrag og bærekraft, Anskaffelser, Lisenser og rettigheter,
#               Sikkerhet og leveransekjede, Digital suverenitet, KI, Finansiering,
#               Metadata og kataloger, Eksempler fra offentlig sektor
#   sprak       språket kilden er skrevet på
#   prioritet   Høy | Middels | Lav
#   status      Gjeldende | Utløpt | Arkivert | Historisk
#   relevans    én eller to setninger om hvorfor kilden er relevant
#   nokkelkilde true for kildene som vises under «Start her» (valgfritt)
#   starttekst  kort norsk forklaring som vises i «Start her» (valgfritt)
#   merknad     intern merknad, vises ikke på siden (valgfritt)
